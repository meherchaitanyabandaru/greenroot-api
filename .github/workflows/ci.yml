name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.22.5
  GITLEAKS_VERSION: v8.21.2

jobs:
  unit:
    name: Unit, lint & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Fails on any known vulnerability reachable from our code.
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      # Every exception is an inline "#nosec <rule> -- <reason>".
      - name: Security lint (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -quiet -exclude-dir=tests ./...

      # Unit tests. ./tests/... needs a running API and runs in the
      # integration job. internal/app includes the OpenAPI drift test.
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v '/tests/')

      # Unit-test coverage on the run, with a floor just under today's level
      # (27.7% on 2026-10-24). The journeys cover business rules end to end
      # and are not counted here.
      - name: Coverage
        env:
          MIN_COVERAGE: '27'
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$NF); print $NF}')
          echo "### API unit-test coverage: ${pct}% (floor ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN {exit !(p >= m)}' || { echo "coverage ${pct}% fell below ${MIN_COVERAGE}%"; exit 1; }

      - name: Build
        run: |
          go build ./cmd/api
          go build ./cmd/migrate
          go build ./cmd/smoke
          go build ./cmd/integration
          go build ./cmd/sqlcheck

  integration:
    name: Integration (PostGIS + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Superuser: loads the schema/seeds and the test fixtures only.
      DATABASE_URL: postgres://greenroot:greenroot@localhost:5432/greenroot?sslmode=disable
      # Production-shaped roles from greenroot-infra roles.sql.
      MIGRATE_DATABASE_URL: postgres://greenroot_migrator:ci-migrator@localhost:5432/greenroot?sslmode=disable
      APP_DATABASE_URL: postgres://greenroot_app:ci-app@localhost:5432/greenroot?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      LOG_DIR: /tmp/gr-logs
    steps:
      - uses: actions/checkout@v4

      # The fresh-install schema and seeds live in greenroot-infra.
      - uses: actions/checkout@v4
        with:
          repository: meherchaitanyabandaru/greenroot-infra
          path: infra

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # PostgreSQL 17 + PostGIS 3 from PGDG: the same versions as development
      # and the infra recovery drills (the postgis/postgis:17-3.5 image lagged
      # behind the PostGIS release the schema is dumped from).
      - name: Install PostgreSQL 17 + PostGIS (PGDG)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-postgis-3
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Start PostgreSQL
        run: |
          initdb -D "$RUNNER_TEMP/pg" -U greenroot --auth=trust >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg" -o "-p 5432 -c listen_addresses=localhost -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
          createdb -h localhost -U greenroot greenroot
          psql -h localhost -U greenroot -d greenroot -XAtc "SELECT version()"

      - name: Load schema and seeds
        run: |
          for f in schema.sql seed-master.sql seed-dev-admin.sql; do
            echo "loading $f"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q -f "infra/db/postgresql/$f"
          done

      # Least-privilege roles (D9): the migrator owns the schema, the API can
      # only read and write rows.
      - name: Create database roles
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q -f infra/db/postgresql/roles.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q \
            -c "ALTER ROLE greenroot_migrator PASSWORD 'ci-migrator'" \
            -c "ALTER ROLE greenroot_app PASSWORD 'ci-app'"

      # schema.sql records the applied migrations; any new migration in this
      # change is applied here, as the migrator role, proving it runs on a
      # fresh-install database with production privileges.
      - name: Apply migrations
        run: go run ./cmd/migrate up

      # Every SQL statement in the code is PREPAREd against the migrated
      # schema: a wrong column or table name fails here, not in production.
      - name: SQL statements match the schema (sqlcheck)
        run: go run ./cmd/sqlcheck ./internal/...

      # Object storage for uploads (profile selfies gate market posting and
      # chats). Default STORAGE_* settings match; the API creates the buckets.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=greenroot -e MINIO_ROOT_PASSWORD=greenroot123 \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not start"; docker logs minio; exit 1

      - name: Start API
        run: |
          go build -o /tmp/greenroot-api ./cmd/api
          # The API runs as greenroot_app, exactly as in production.
          DATABASE_URL="$APP_DATABASE_URL" /tmp/greenroot-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat /tmp/api.log; exit 1

      - name: API integration tests
        run: |
          go test -count=1 ./tests/...
          # No over-privilege warning may appear in the API log.
          if grep -q "over-privileged" /tmp/api.log; then cat /tmp/api.log; exit 1; fi

      # End-to-end user journeys: positive and negative business rules,
      # including the Redis side effects (rate limits, caches, blocklist).
      - name: API journeys
        run: python3 -I tests/journeys/journeys.py

      - name: API log (on failure)
        if: failure()
        run: tail -200 /tmp/api.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION} git --no-banner --redact --exit-code 1 .
