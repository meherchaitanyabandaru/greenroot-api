name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Unit tests only. ./tests/... and test-api.sh drive a running API with a
      # seeded database and run outside CI (see API.md "Testing").
      # internal/app includes the OpenAPI drift test (every route documented).
      - name: Test
        run: go test -race $(go list ./... | grep -v '/tests/')

      - name: Build
        run: |
          go build ./cmd/api
          go build ./cmd/migrate
          go build ./cmd/smoke
          go build ./cmd/integration
