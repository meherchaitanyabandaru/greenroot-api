          description: "{ seller: SellerProfile }"
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /api/v1/market/admin/ads:
    get:
      tags: [Market]
      summary: All market ads in any status (admin)
      description: >-
        Under-review ads first, then ads with open reports. Each row has photos, description, poster name and
        selfie, open report count, and the nursery's strikes and posting block.
      operationId: listMarketAdminAds
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED, EXPIRED, ARCHIVED, SUSPENDED, REMOVED] } }
        - { in: query, name: search, schema: { type: string }, description: Title, plant, ad code or nursery name }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: "{ ads: AdminAd[], pagination }"
        "400":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /api/v1/market/admin/ads/{id}/moderate:
    post:
      tags: [Market]
      summary: Hide, restore or remove an ad directly (admin)
      description: >-
        HIDE: live or paused → SUSPENDED with the note. RESTORE: SUSPENDED → PUBLISHED, open reports dismissed.
        REMOVE: → REMOVED with the note, open reports closed, a strike and any posting block (as an upheld report).
        A wrong starting status is 409.
      operationId: moderateMarketAd
      security:
        - BearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [HIDE, RESTORE, REMOVE] }
                note: { type: string, maxLength: 500, description: Shown to the seller; required for HIDE and REMOVE }
      responses:
        "200":
          description: "{ ad: AdminAd, outcome: { strikes, blocked_until } }"
        "400":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /api/v1/market/admin/nurseries/{id}/unblock:
    post:
      tags: [Market]
      summary: Lift a nursery's market posting block early (admin)
      operationId: unblockMarketNursery
      security:
        - BearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: "{ nursery_id, blocked_until: null }"
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /api/v1/market/reports:
    get:
      tags: [Market]
      summary: Reported market ads (admin)
      description: >-
        Reports nurseries filed with POST /market/ads/{id}/report, pending first and serious ones
        (EXPLICIT_CONTENT, PROHIBITED, which hid the ad as SUSPENDED on report) at the top. Each carries
        the ad's photos and description, the reporter, and the seller nursery's strikes
        (ads already removed) and posting block.
      operationId: listMarketReports
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, REVIEWED, DISMISSED] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: One page of reports
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /api/v1/market/reports/{id}/review:
    post:
      tags: [Market]
      summary: Decide a report (admin) — REMOVE the ad or DISMISS the report
      operationId: reviewMarketReport
      security:
        - BearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [REMOVE, DISMISS]
                  description: >-
                    REMOVE marks the ad REMOVED, closes every open report on it as REVIEWED and gives the
                    nursery a strike (2nd = 30-day posting block, 3rd+ = 90 days). DISMISS closes this report;
                    a SUSPENDED ad goes live again once no serious report is open.
      responses:
        "200":
          description: "The updated report and outcome: { report, outcome: { strikes, blocked_until } }"
        "400":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          description: already_reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/botanical-names:
    get:
      tags: [Plants]
      summary: Browse all botanical names (admin)
      description: >-
        All ~1.66 M World Flora Online names, paginated, with the catalog plant of
        each name's species (if any) and its English name. search matches
        scientific names and the English/local names of catalog plants ("neem").
        Searching without sort_by orders by best match; otherwise by scientific
        name (or family).
      operationId: listBotanicalNames
      security:
        - BearerAuth: []
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: search, schema: { type: string }, example: cumini }
        - { in: query, name: family, schema: { type: string }, example: Myrtaceae }
        - { in: query, name: status, schema: { type: string, enum: [ACCEPTED, SYNONYM, UNCHECKED] } }
        - { in: query, name: rank, schema: { type: string }, example: species }
        - { in: query, name: in_catalog, schema: { type: boolean } }
        - in: query
          name: show_synonyms
          description: List old names (synonyms) as rows. Default false — one row per plant; a search on an old name returns its accepted plant with matched_name set.
          schema: { type: boolean, default: false }
        - { in: query, name: sort_by, schema: { type: string, enum: [scientific_name, family] } }
        - { in: query, name: sort_order, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: One page of names
          content:
            application/json:
              schema:
                type: object
                properties:
                  names:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotanicalRow"
                  pagination:
                    type: object
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /api/v1/botanical-names/families:
    get:
      tags: [Plants]
      summary: Plant families with name counts (admin)
      operationId: listBotanicalFamilies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Every family with its number of names, accepted names and names whose species is in the catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  families:
                    type: array
                    items:
                      type: object
                      properties:
                        family: { type: string, example: Myrtaceae }
                        names: { type: integer }
                        accepted: { type: integer }
                        in_catalog: { type: integer }
                  total_names:
                    type: integer
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /api/v1/botanical-names/{wfoId}:
    get:
      tags: [Plants]
      summary: One botanical name with its accepted name and synonyms (admin)
      operationId: getBotanicalName
      security:
        - BearerAuth: []
      parameters:
        - { in: path, name: wfoId, required: true, schema: { type: string }, example: wfo-0000734376 }
      responses:
        "200":
          description: The name, its accepted name (for a synonym) and up to 50 synonyms of the species
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    $ref: "#/components/schemas/BotanicalRow"
                  accepted:
                    $ref: "#/components/schemas/BotanicalRow"
                  synonyms:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotanicalRow"
                  synonym_count:
                    type: integer
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /api/v1/plants/lookup:
    get:
      tags: [Plants]
      summary: Plant picker search
      description: >-
        Catalog plants first (matched on code, scientific, common and local names),
        then World Flora Online botanical names that are not in the catalog yet,
        one row per species. Botanical names are searched only for 3+ characters.
        Each result has exactly one of `plant` or `name`; pass `name.wfo_id` to
        POST /api/v1/plants/resolve to get a catalog plant.
      operationId: lookupPlants
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          example: cumini
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Picker results, best match first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLookupResponse"
        "401":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
  /api/v1/plants/resolve:
    post:
      tags: [Plants]
      summary: Get or add the catalog plant for a botanical name
      description: >-
        Returns the catalog plant for the species of `wfo_id`, adding it to the
        catalog on first use (any signed-in user). A synonym resolves to its
        accepted species, so a species is never in the catalog twice; concurrent
        calls return the same plant.
      operationId: resolvePlant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wfo_id]
              properties:
                wfo_id:
                  type: string
                  example: wfo-0000318521
      responses:
        "200":
          description: The catalog plant
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          description: "plant_removed: an admin removed this species from the catalog"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: '#/components/responses/Error'
