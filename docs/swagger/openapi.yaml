      properties:
        mobile:
          type: string
          example: "9000000002"
        otp:
          type: string
          example: "123456"
        device_type:
          type: string
          example: "MOBILE"
        os_name:
          type: string
          example: "ANDROID"
        app_version:
          type: string
          example: "1.0.0"
