    get:
      tags: [Market]
      summary: A nursery's public market profile
      description: >-
        Opened from the seller photo on an ad: nursery name, verified flag, city, owner name and selfie,
        member since, ads posted, live ads, deals agreed, and its live ads. No strikes or private data.
      operationId: getMarketNurseriesByid
      security:
        - BearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
