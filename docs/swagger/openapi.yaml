      scheme: bearer
      bearerFormat: JWT
  schemas:
    VersionPolicy:
      type: object
      properties:
        platform: { type: string, enum: [android, ios, web] }
        minimum_version: { type: string, example: "1.2.0" }
        latest_version: { type: string, example: "1.4.0" }
        update_url: { type: string }
        current_version: { type: string }
        update_required: { type: boolean }
        update_available: { type: boolean }
    CrashReportRequest:
      type: object
      required: [platform, app_version, error_type, message]
      properties:
        platform: { type: string, enum: [android, ios, web] }
        app_version: { type: string, maxLength: 32 }
        build_number: { type: string }
        os_version: { type: string }
        device_model: { type: string }
        error_type: { type: string, maxLength: 200 }
        message: { type: string, maxLength: 2000 }
        stack_trace: { type: string, maxLength: 16000 }
        context:
          type: object
          additionalProperties: { type: string }
          description: Up to 20 keys, values up to 200 characters
        is_fatal: { type: boolean }
        occurred_at: { type: string, format: date-time }
    CrashReport:
      allOf:
        - $ref: "#/components/schemas/CrashReportRequest"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            user_id: { type: integer, format: int64 }
            received_at: { type: string, format: date-time }
            request_id: { type: string }
