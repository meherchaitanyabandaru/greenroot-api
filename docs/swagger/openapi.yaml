  /api/v1/app/version-policy:
    get:
      tags: [App]
      summary: App version policy (forced / optional update)
      description: >-
        Public. Apps call this on launch. With `version`, the response says
        whether this build must update (`update_required`, below the minimum)
        or may update (`update_available`). Cached for 5 minutes.
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string, enum: [android, ios, web] }
        - name: version
          in: query
          required: false
          schema: { type: string, example: "1.4.2" }
      responses:
        "200":
          description: Version policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy:
                    $ref: "#/components/schemas/VersionPolicy"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/app/crash-reports:
    post:
      tags: [App]
      summary: Report an app crash
      description: >-
        Public (a crash before sign-in is still reported); a valid bearer
        token links the report to the user. Tokens, OTPs, passwords, mobile
        numbers and email addresses are scrubbed and long fields truncated
        before storage. No IP address is stored. Rate limited to 30 per IP
        per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrashReportRequest"
      responses:
        "202":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
