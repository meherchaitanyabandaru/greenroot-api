      parameters:
        - { name: app_version, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string, enum: [android, ios, web] } }
        - { name: fatal, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrashReport"
                  total: { type: integer, format: int64 }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
components:
  responses:
    VersionConflict:
      description: >-
        The resource changed since the client read it (`error.code` is
        `version_conflict`), or the action is not allowed in its current
        state. Reload the resource and retry with its new `version`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Error envelope returned by every endpoint on failure
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Optimistic concurrency. Send the `version` from the last read
        (`3` or `"3"`); if the resource has changed since, the request fails
        with 409 `version_conflict` and nothing is written. Omit to write
        unconditionally. A malformed value is 400 `invalid_if_match`.
      schema:
        type: string
        example: '"3"'
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AddressID:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlantID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    NurseryID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TopItemID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PlantRequestID:
